<!doctype html>
<html lang="en" data-theme="command">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>Task Bar Search</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="card" id="card">
  <i class="trim" aria-hidden="true"></i>
  <header class="head">
    <span class="head-title" id="title">All apps</span>
    <span class="head-hint" id="hint">Type to search apps, files and settings</span>
  </header>
  <main class="body" id="body" role="listbox" aria-label="Results"></main>
  <footer class="foot">
    <button class="foot-btn" id="winStart"></button>
    <span class="grow"></span>
    <button class="foot-btn" id="openSettings"></button>
  </footer>
</div>
<script src="icons.js"></script>
<script src="panel.js"></script>
</body>
</html>
